appId: local.browserfingerprint.app
productName: Browser Fingerprint
directories:
  buildResources: build
  output: dist
# Mọi phụ thuộc đã được gộp vào out/main (xem electron.vite.config.ts), nên chỉ cần thư mục out.
files:
  - out/**
  - package.json
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.utilities
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # Không có chứng chỉ Apple: ký ad-hoc để app chạy được trên Apple Silicon (chữ ký gốc của Electron bị hỏng khi đóng gói).
  identity: "-"
  # Hardened runtime chỉ cần khi công chứng với Apple; với chữ ký ad-hoc nó có thể chặn app nạp thư viện của chính nó.
  hardenedRuntime: false
dmg:
  artifactName: Browser-Fingerprint-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: x64
  executableName: Browser Fingerprint
nsis:
  artifactName: Browser-Fingerprint-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
# Chỉ giữ tiếng Anh và tiếng Việt cho phần khung Electron.
electronLanguages:
  - en
  - vi
